[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amfca"
version = "1.0.0"
description = "Auditable multisensor flood change assessment and Lhende 2026 reproducibility workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "rasterio>=1.3", "scipy>=1.10",
  "shapely>=2.0", "pyproj>=3.5", "PyYAML>=6.0", "requests>=2.31",
  "matplotlib>=3.7", "Pillow>=10", "openpyxl>=3.1"
]

[project.optional-dependencies]
earthengine = ["earthengine-api>=1.0", "geemap>=0.30"]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
